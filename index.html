its length the moment it becomes a pointer, which is why C functions taking arrays nearly always take a
count alongside — the <code>(pointer, length)</code> pair you see everywhere.</p>`,

"Struct fields are just offsets":
`<p>Defining and using a struct:</p>
<pre><span class="k">typedef struct</span> {
    <span class="k">int</span> x;
    <span class="k">int</span> hp;
} Actor;

Actor  a;        <span class="c">/* an actor, by value        */</span>
Actor *p = &amp;a;   <span class="c">/* a pointer to one          */</span>

a.hp = 100;      <span class="c">/* dot   — through the value */</span>
p-&gt;hp = 100;     <span class="c">/* arrow — through a pointer */</span></pre>
<p>That is the whole distinction: dot when you have the struct, arrow when you have its address.
<code>p-&gt;hp</code> is exact shorthand for <code>(*p).hp</code>, which is why the arrow exists — the
parentheses are needed because dot binds tighter than the star.</p>
<p>The <code>typedef</code> is what lets you write <code>Actor</code> instead of
<code>struct Actor</code> everywhere. Game code almost always uses it.</p>`,

"Narrow fields, and the holes between them":
`<p>Field order in the source is field order in memory — the compiler never rearranges them. That is what
makes struct recovery possible at all, and it means declaration order is something you have to get right
when matching, not just a style choice.</p>
<p>Ordering fields largest-first is the usual efficiency habit, since it minimises the padding between
them. But when you are reconstructing an original struct, the offsets in the assembly dictate the order —
including any padding the original programmer accidentally left in.</p>`,

"Comparison is a value, not a flag":
`<p>A comparison in C produces an <code>int</code>: exactly 1 when true, exactly 0 when false. So
<code>return a &lt; b;</code> is a perfectly ordinary thing to write, not a trick.</p>
<p>The trap in the other direction: <code>=</code> assigns, <code>==</code> compares.
<code>if (x = 5)</code> sets x to 5 and is always true. It compiles without complaint.</p>`,

"Comparing against a constant":
`<p>All six comparisons: <code>&lt; &gt; &lt;= &gt;= == !=</code>. Nothing exotic, but two
reminders.</p>
<p>Comparing a signed value against an unsigned one silently converts the signed one to unsigned, so a
negative number becomes enormous and the test comes out backwards. Keep both sides the same signedness.</p>
<p>And chained comparisons don't work as written — <code>0 &lt;= x &lt; 10</code> is legal C that does not
mean what it looks like. Write <code>x &gt;= 0 &amp;&amp; x &lt; 10</code>.</p>`,

"The early return":
`<p>The guard clause pattern: handle the impossible case first and leave, so the rest of the function can
assume things are fine.</p>
<pre><span class="k">int</span> f(<span class="k">int</span> *p)
{
    <span class="k">if</span> (p == NULL) {
        <span class="k">return</span> 0;
    }
    <span class="k">return</span> *p;
}</pre>
<p><code>NULL</code> is just 0 with a name that says "pointer". <code>if (!p)</code> means the same
thing.</p>
<p>Braces are optional around a single statement but put them in anyway — the most famous bug class in C
comes from adding a second line to a braceless <code>if</code> and having it run unconditionally. The
generated code is identical either way.</p>`,

"Picking the larger of two":
`<p>The conditional operator packs an if/else into an expression:</p>
<pre>result = (a &lt; b) ? b : a;   <span class="c">/* condition ? if-true : if-false */</span></pre>
<p>Use it for choosing a value, as here. Do not use it for choosing an <em>action</em>, and never nest
them — a chain of three is unreadable and an <code>if</code> ladder is free.</p>
<p>Old game code usually wrapped this in a macro: <code>#define MAX(a,b) ((a) &gt; (b) ? (a) : (b))</code>,
with every argument parenthesised because the macro is raw text substitution and unparenthesised arguments
collide with surrounding operators.</p>`,

"A leaf function has no frame":
`<p>Expressions mix operators by precedence, not left to right: <code>a * 2 + b</code> multiplies first.
When you want the other order you parenthesise, and when the order is already right you can parenthesise
anyway for the reader — it costs nothing and generates nothing.</p>`,

"Passing a call's result straight back":
`<p>C needs to know a function's shape before you call it, which is what a <b>prototype</b> is:</p>
<pre><span class="k">int</span> helper(<span class="k">void</span>);   <span class="c">/* declaration: exists somewhere, returns int, takes nothing */</span></pre>
<p><code>void</code> in the parameter list means "genuinely no arguments". Leaving the parentheses empty
means something subtly different in old C — "unspecified" — so write <code>void</code>.</p>
<p>In a real project these declarations live in a header file that every <code>.c</code> includes.</p>`,

"Arguments go in, result comes out":
`<p>A call is an expression, so it can be used anywhere a value can: <code>helper(b) + 1</code>,
<code>x = helper(b)</code>, <code>if (helper(b) &gt; 0)</code>. It evaluates to whatever the function
returned.</p>
<p>Arguments are evaluated before the call, and C does not define what order multiple arguments are
evaluated in — so never write <code>f(i++, i)</code>. In matching work you will sometimes see the compiler
evaluate arguments in an order you did not expect, and that is allowed.</p>`,

"Keeping a value alive across a call":
`<p>Nothing in the C says "save this register" — you write the expression and the compiler works out what
must survive. That means the prologue is downstream of your code's shape: if your version saves a different
number of registers than the original, the difference is in how the values flow, not in anything you can
fix directly.</p>`,

"Swapping arguments on the way in":
`<p>Argument order is positional and unchecked in spirit — a C compiler of this era will happily let a
wrong-but-same-type argument through. When two parameters have the same type, the assembly is your only
evidence for which is which, so read the argument registers at the call rather than guessing from the
names.</p>`,

"A function that returns nothing":
`<p><code>void</code> as a return type means the function produces no value, so calling it is a statement
rather than an expression. You cannot write <code>x = init();</code>.</p>
<p>Statements run in order, separated by semicolons. This is one of the few places where C gives you a
guarantee about ordering — within an expression it does not.</p>`,

"Summing an array":
`<p>The three-part <code>for</code>: setup, test, step.</p>
<pre><span class="k">int</span> i;
<span class="k">for</span> (i = 0; i &lt; n; i++) {
    sum += p[i];
}</pre>
<p>Setup runs once, the test runs before every pass, the step runs after every pass. <code>i++</code> adds
one, and <code>sum += x</code> is shorthand for <code>sum = sum + x</code>.</p>
<p>Declare your loop variable at the top of the function, not inside the <code>for</code>. Declaring inside
is a later C standard than these compilers accept, and it will simply fail to build.</p>`,

"Writing in a loop":
`<p>Two ways to walk memory, both common:</p>
<pre><span class="k">for</span> (i = 0; i &lt; n; i++)    p[i] = 0;    <span class="c">/* by index   */</span>
<span class="k">while</span> (n--)                *p++ = 0;    <span class="c">/* by pointer */</span></pre>
<p><code>*p++ = 0</code> stores through the pointer and then advances it, because <code>++</code> after the
name yields the old value. Dense, idiomatic, and very common in code of this vintage — worth being able to
read even if you prefer writing the indexed form.</p>`,

"Copying between two arrays":
`<p>C will not stop you copying overlapping regions, reading past the end, or passing the arguments in the
wrong order. None of it is checked at compile time or at run time.</p>
<p>The habit that saves you: whenever a function takes a pointer and a count, treat the count as part of the
pointer's meaning and keep them together. Almost every memory bug in C is a pointer that outlived or
outgrew its length.</p>`,

"Reading a global":
`<p>A <b>global</b> is declared outside any function and lives at a fixed address for the whole run.
<code>extern</code> in front means "this exists, defined in another file" — that is what goes in a header,
while exactly one <code>.c</code> file has the real definition.</p>
<pre><span class="k">int</span> g_frame;          <span class="c">/* definition: one file only  */</span>
<span class="k">extern int</span> g_frame;   <span class="c">/* declaration: every other   */</span></pre>`,

"Writing a global":
`<p><code>static</code> on a global means "visible only within this file". It changes nothing about the
generated instructions for the access itself, but it does affect whether other files can reach the symbol —
which matters when you are reassembling a project file by file.</p>`,

"Updating a global in place":
`<p><code>++</code> and <code>--</code> come in two flavours: <code>x++</code> yields the old value then
increments, <code>++x</code> increments then yields the new one. Alone on a line they are identical. Inside
a larger expression they are not, and the compiled code differs.</p>
<p>Never use more than one on the same variable in a single expression — <code>a[i++] = i</code> is
undefined behaviour, not a clever trick.</p>`,

"Indexing a global array":
`<p>An array declared <code>extern int g_table[];</code> has no size in that declaration, which is legal —
the size lives with the definition. It also means <code>sizeof(g_table)</code> will not work here, and that
nothing anywhere checks your index.</p>`,

"Floats have their own registers":
`<p><code>float</code> is 4 bytes, <code>double</code> is 8. On this hardware <code>float</code> is fast and
<code>double</code> is emulated in software, so prefer <code>float</code> and write literals with an
<code>f</code> suffix — <code>1.5f</code>, not <code>1.5</code>, because an unsuffixed literal is a
<code>double</code> and will drag the whole expression into software emulation.</p>`,

"Crossing between integer and float":
`<p>Converting between int and float loses things in both directions: a cast to <code>int</code> truncates
toward zero (<code>(int)-2.7</code> is −2, not −3), and a large <code>int</code> cast to
<code>float</code> loses low bits, since a float only carries about 24 bits of precision.</p>
<p>C also converts implicitly when you mix types in one expression, which is why <code>return a;</code> from
a <code>float</code> function compiles the same as the explicit cast. Writing the cast anyway documents that
you meant it.</p>`,

"Comparing floats sets a flag":
`<p>Never compare floats with <code>==</code>. Values that are mathematically equal often differ in their
last bits after arithmetic, so equality tests fail unpredictably. Compare against a tolerance instead, or
restructure to use <code>&lt;</code>.</p>`,

"Choosing without branching":
`<p>The condition in a ternary follows C's usual truth rule — zero false, anything else true — so
<code>cond ? a : b</code> and <code>cond != 0 ? a : b</code> are the same test. Both branches must produce
the same type; mixing an <code>int</code> and a <code>float</code> silently converts one of them.</p>`,

"Bitfields in one instruction":
`<p>C can declare packed fields directly inside a struct:</p>
<pre><span class="k">struct</span> {
    <span class="k">unsigned int</span> kind  : 4;   <span class="c">/* 4 bits  */</span>
    <span class="k">unsigned int</span> level : 4;
    <span class="k">unsigned int</span> hp    : 8;
};</pre>
<p>The compiler generates the shifting and masking for you. It is compact and readable, but the exact bit
ordering is left to the compiler, so code that needs a specific layout — hardware registers, file formats —
usually does the masking by hand instead.</p>`,

"Sign-extending in one step":
`<p>Casting to a narrower type keeps the low bytes and throws the rest away. Casting back out re-widens
using that type's signedness, which is where the sign-extension comes from.</p>
<pre>x = 0x1234;
(<span class="k">signed char</span>)x   <span class="c">/* 0x34 = 52     */</span>
x = 0x12F0;
(<span class="k">signed char</span>)x   <span class="c">/* 0xF0 = -16    */</span></pre>
<p>Round-tripping through a narrow type is a lossy operation dressed up as a pair of casts, so when you see
one in assembly it was almost certainly deliberate.</p>`
};

/* ---------- glossary ---------- */
const GLOSS = {
"bit":"A single 0 or 1 — the smallest thing a computer stores. Everything else is a pile of these.",
"byte":"Eight bits, holding a number from 0 to 255. Memory is measured in bytes, and every byte has its own address.",
"halfword":"Two bytes, 16 bits. In C that is a <code>short</code>.",
"word":"Four bytes, 32 bits. On this machine a register holds exactly one word, and so does an instruction. In C that is an <code>int</code>.",
"hex":"Base-16 numbers, written with a <code>0x</code> prefix. Each hex digit is exactly four bits, so one byte is always two hex digits: <code>0xF3</code>, <code>0x00</code>. It is used because the digit boundaries line up with the bit boundaries, which decimal's don't.",
"register":"One of 32 storage slots inside the CPU, each holding 32 bits. They are the only place arithmetic can happen — anything in memory must be loaded into one first.",
"RAM":"The computer's main memory: a huge array of bytes outside the CPU. The PS1 has 2 MB of it. Slower to reach than a register, which is why values get loaded into registers to be worked on.",
"address":"A byte's position in memory, written as a hex number like <code>0x80014000</code>. Just an index into the giant array that is RAM.",
"pointer":"A variable holding an address instead of a value. In assembly a pointer is nothing more than an address sitting in a register.",
"dereference":"Following a pointer: going to the address it holds and reading what is there. In C that is the <code>*</code> operator; in assembly it is a load instruction.",
"offset":"The constant added to an address inside a load or store, written as <code>0x10($a0)</code>. It costs nothing extra, so compilers fold constant indexes and struct field positions into it.",
"immediate":"A number baked directly into the instruction rather than read from a register. Instructions ending in <code>i</code> — <code>addiu</code>, <code>andi</code>, <code>slti</code> — take one, which means the source code had a literal number there.",
"instruction":"One command to the CPU. On MIPS every instruction is exactly four bytes, and it <em>is</em> a 32-bit number — the text form like <code>addiu $v0, $a0, 5</code> is a human convention for that number.",
"opcode":"The part of an instruction's bits that says which operation it is. The top six bits on MIPS.",
"mnemonic":"The short text name of an instruction — <code>lw</code>, <code>addu</code>, <code>beqz</code>. Short for the operation it performs, e.g. <code>lw</code> is 'load word'.",
"operand":"One of the things an instruction works on, usually a register or a constant. <code>addu $v0, $a0, $a1</code> has three operands.",
"delay slot":"The instruction printed indented under a branch or jump. The CPU has already fetched it by the time it works out where the jump goes, so it runs whether or not the branch is taken. Read a jump and its delay slot as one unit.",
"branch":"An instruction that jumps somewhere else if a condition holds — the machinery behind <code>if</code>, loops and early returns.",
"label":"A name for an address in the code, like <code>.L_ok:</code>, used as a branch target. Invented by the disassembler; it has no existence in the actual bytes.",
"assembly":"The human-readable form of machine code: one line per instruction. What you are reading in every lesson here.",
"compiler":"The program that turns C source into machine instructions. For the PS1 that is GCC 2.7.2, and matching means finding C that makes it produce the exact instructions you were given.",
"matching":"Writing C that compiles to byte-identical output — same instructions, same registers, same order. The pass/fail standard of this kind of decompilation.",
"mask":"A constant used with AND or OR to keep, clear or set particular bits. <code>x &amp; 0xFF</code> masks off everything above the low byte.",
"shift":"Sliding a value's bits sideways. Left by <em>n</em> multiplies by 2ⁿ, right divides by it. Costs one cycle, versus about twelve for a real multiply, which is why compilers reach for it constantly.",
"signed":"A type that can hold negatives, because the top bit is treated as a sign. An <code>int</code> is signed by default.",
"unsigned":"A type that cannot be negative — the top bit is just another value bit, so the range runs 0 upward instead of splitting around zero.",
"unsigned byte":"A byte read as 0–255, with no negative interpretation. Loaded with <code>lbu</code>, and its C type is <code>unsigned char</code>.",
"unsigned char":"C's one-byte unsigned type, holding 0–255. PS1 decomp projects usually typedef it to <code>u8</code>. It is what a <code>lbu</code> in the assembly is telling you about.",
"signed char":"C's one-byte signed type, holding −128 to 127. Loaded with <code>lb</code>, which fills the upper bits with the byte's sign.",
"char":"C's one-byte type. On this toolchain a plain <code>char</code> is signed, which is why decomp projects prefer explicit <code>u8</code> and <code>s8</code> names.",
"short":"C's two-byte type, holding a halfword. Loaded with <code>lh</code> or <code>lhu</code>.",
"sign-extend":"Filling the unused upper bits of a register with copies of the value's top bit, so a small negative number stays negative when widened. <code>0xF3</code> as a signed byte becomes <code>0xFFFFFFF3</code>, which is −13.",
"zero-extend":"Filling the unused upper bits with zeros, so a small value widens without gaining a sign. <code>0xF3</code> becomes <code>0x000000F3</code>, which is 243.",
"two's complement":"How negative numbers are stored: to write −n, take n in binary, flip every bit, add 1. It means subtraction can reuse the ordinary adder, so the hardware needs no separate subtract circuit.",
"sign bit":"The topmost bit of a signed value. 1 means negative. Everything about signed versus unsigned comes down to whether that bit is treated as a value or as a sign.",
"struct":"A bundle of variables laid out consecutively in memory. Reaching a field means going a fixed distance past the start, which is why struct access shows up as a load with an offset.",
"field":"One named member of a struct. In the assembly its name is gone and only its offset survives.",
"padding":"Unused bytes the compiler inserts between struct fields so each one lands at an address its size can reach. It is why field offsets are often not what you would get by adding up the sizes.",
"alignment":"The rule that a value must sit at an address divisible by its own size — 4 for a word, 2 for a halfword. This machine enforces it in hardware: a misaligned load raises an exception instead of being fixed up.",
"array":"A run of equally sized values laid out back to back. Indexing one means multiplying the index by the element size and adding it to the base address.",
"element size":"How many bytes one array entry occupies. Recovering it from the shift or multiply in an indexing sequence gives you the <code>sizeof</code> of whatever the array holds.",
"stack":"A region of memory a function uses as scratch space, tracked by the <code>$sp</code> register. It grows downward, so a function claims room by subtracting from <code>$sp</code>.",
"prologue":"The first few instructions of a function: claim stack space and save the registers this function has promised not to damage.",
"epilogue":"The last few instructions of a function: restore what the prologue saved, release the stack space, and return.",
"argument":"A value passed into a function. The first four arrive in <code>$a0</code> through <code>$a3</code>, in order; any beyond that go on the stack.",
"return value":"What a function hands back to its caller. Always whatever is in <code>$v0</code> when it returns.",
"null":"A pointer value of 0, meaning 'points at nothing'. Checking for it before dereferencing is the most common branch in game code.",
"cycle":"One tick of the CPU clock. The PS1's runs at about 33 million per second. Most instructions take one; a multiply takes roughly twelve and a divide about thirty-five, which is why compilers avoid them.",
"pipeline":"The CPU's assembly line — several instructions in flight at once, each at a different stage. It is the reason the delay slot exists: the next instruction is already in the pipe when a branch resolves.",
"exception":"A fault that yanks the CPU out of your code — a misaligned access, a divide-by-zero trap. On a retail PS1 an unhandled one is a hang or a black screen.",
"quotient":"The result of a division, ignoring the remainder. On MIPS it lands in the <code>LO</code> register and is fetched with <code>mflo</code>.",
"remainder":"What is left over from a division. It lands in <code>HI</code> and is fetched with <code>mfhi</code> — which is what C's <code>%</code> compiles to.",
"fixed point":"Storing fractional numbers as plain integers with an imagined binary point. The PS1 has no floating-point unit, so all its positions, angles and scales work this way — typically 4096 meaning 1.0.",
"GTE":"The Geometry Transformation Engine, a coprocessor inside the PS1 that does 3D maths in fixed point. Its operations are single instructions, so a function doing heavy 3D work can contain almost no arithmetic.",
"flag":"A single bit used as a yes/no switch, usually packed with others into one word. Set with OR, cleared with AND, tested with AND.",
"calling convention":"The agreed rules about which registers carry arguments, hold the return value, and must survive a call. The hardware does not enforce any of it; the compiler and libraries just agree. The PS1's is called o32."
};

const GKEYS = Object.keys(GLOSS).sort((a,b) => b.length - a.length);

function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }

function glossify(root){
  const used = {};
  const nodes = [];
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; while((n = walk.nextNode())) nodes.push(n);
  let placed = 0;
  while(nodes.length && placed < 12){
    const node = nodes.shift();
    if(!node.parentNode) continue;
    if(node.parentNode.closest("pre, a, .gloss")) continue;
    let best = null;
    for(const key of GKEYS){
      if(used[key]) continue;
      const m = new RegExp("\\b" + esc(key) + "(s|es)?\\b", "i").exec(node.nodeValue);
      if(m && (!best || m.index < best.m.index)) best = {key, m};
    }
    if(!best) continue;
    const {key, m} = best;
    const after = node.splitText(m.index);
    after.nodeValue = after.nodeValue.slice(m[0].length);
    const b = document.createElement("button");
    b.className = "gloss"; b.type = "button";
    b.textContent = m[0]; b.dataset.k = key;
    after.parentNode.insertBefore(b, after);
    used[key] = true; placed++;
    nodes.unshift(after);
  }
  [...root.querySelectorAll(".gloss")].forEach(el => {
    el.onclick = e => { e.stopPropagation(); showGloss(el); };
    el.onmouseenter = () => { if(matchMedia("(hover:hover)").matches) showGloss(el); };
  });
}

let gcur = null;
function showGloss(el){
  if(gcur) gcur.classList.remove("on");
  gcur = el; el.classList.add("on");
  $("gterm").textContent = el.textContent;
  $("gdef").innerHTML = GLOSS[el.dataset.k];
  $("gpanel").classList.add("on");
}
function hideGloss(){
  $("gpanel").classList.remove("on");
  if(gcur){ gcur.classList.remove("on"); gcur = null; }
}

/* ---------- state ---------- */
let cur = 0, solved = {}, seen = {}, ready = false, cOpen = true;
const KEY = "ps1-decomp-progress-v1";

const store = {
  async get(k){
    if(typeof window.storage !== "undefined" && window.storage) return await window.storage.get(k);
    const v = localStorage.getItem(k);
    return v === null ? null : {key:k, value:v};
  },
  async set(k,v){
    if(typeof window.storage !== "undefined" && window.storage) return await window.storage.set(k,v);
    localStorage.setItem(k,v); return {key:k, value:v};
  }
};

async function load(){
  try{
    const r = await store.get(KEY);
    if(r && r.value){ const d = JSON.parse(r.value); solved = d.solved||{}; seen = d.seen||{}; cur = d.cur||0;
      if(typeof d.cOpen === "boolean") cOpen = d.cOpen; }
  }catch(e){ /* first run, or storage unavailable */ }
  ready = true; render();
}
async function save(){
  if(!ready) return;
  try{ await store.set(KEY, JSON.stringify({solved,seen,cur,cOpen})); }catch(e){}
}

/* ---------- answer checking ---------- */
function norm(s){
  s = String(s||"");
  s = s.replace(/\/\*[\s\S]*?\*\//g,"").replace(/\/\/.*$/gm,"");
  s = s.replace(/\s+/g," ").trim();
  s = s.replace(/\s*([(){}\[\];,+\-*\/%&|^~!<>=?:])\s*/g,"$1");
  if(s && !/[;}]$/.test(s)) s += ";";
  return s;
}
function loose(s){ return norm(s).replace(/[()]/g,"").toLowerCase(); }
const CKEY = new Set(["int","char","short","long","unsigned","signed","void","float","double",
  "if","else","for","while","do","return","break","continue","switch","case","default","struct",
  "typedef","static","const","sizeof","NULL"]);

/* collapse locally invented names so a loop answer isn't rejected over calling it sum vs total */
function anon(s, keep){
  return s.replace(/[A-Za-z_][A-Za-z0-9_]*/g, w =>
    (CKEY.has(w) || keep.indexOf(w) >= 0) ? w : "v");
}
function check(input, answers, keep){
  const a = norm(input), b = loose(input);
  if(!a || a===";") return false;
  for(const ans of answers){ if(a===norm(ans) || b===loose(ans)) return true; }
  if(keep){
    const ai = anon(b, keep);
    for(const ans of answers){ if(ai === anon(loose(ans), keep)) return true; }
  }
  return false;
}

/* ---------- rendering ---------- */
const $ = id => document.getElementById(id);

function asmHTML(rows){
  let addr = 0, out = '<div class="listing"><table>';
  for(const r of rows){
    if(r[0]==="LABEL"){
      out += `<tr><td class="addr"></td><td colspan="2" class="lbl">${r[1]}</td></tr>`;
      continue;
    }
    const hex = "0x" + addr.toString(16).padStart(2,"0");
    const ops = String(r[1]||"").replace(/(\.L_[A-Za-z0-9_]+)/g,'<span class="lbl">$1</span>');
    out += `<tr class="${r[2]?"slot":""}"><td class="addr">${hex}</td>`+
           `<td class="mn">${r[2]?" ":""}${r[0]}</td><td class="op">${ops}</td></tr>`;
    addr += 4;
  }
  return out + "</table></div>";
}

function render(){
  const l = L[cur];
  seen[l.title] = true;

  $("kicker").textContent = `Chapter ${l.ch+1} · ${CH[l.ch]}`;
  $("title").textContent = l.title;
  $("body").innerHTML = l.body;
  glossify($("body"));
  hideGloss();
  $("brand").innerHTML = `<b>Decomp Trainer</b> · lesson ${cur+1} of ${L.length}`;
  $("rail").style.width = (100*Object.keys(solved).length/L.filter(x=>x.kind==="ex").length) + "%";

  const plat = l.plat || "R3000A (PS1) · GCC 2.7.2 &nbsp;-O2";
  $("asmZone").innerHTML = l.asm ? asmHTML(l.asm) +
    `<div class="caption">${plat} · addresses relative to the function start</div>` : "";

  if(l.kind === "ex"){
    const done = !!solved[l.title];
    const cn = CNOTE[l.title] ? `<details class="cnote" id="cn" ${cOpen?"open":""}>
        <summary>C side \u2014 the syntax you need</summary>
        <div class="inner">${CNOTE[l.title]}</div></details>` : "";
    $("work").innerHTML = cn + `
      <div class="editor">
        <div class="sig">${l.sig}<br>{</div>
        <textarea id="ta" spellcheck="false" autocapitalize="off" autocorrect="off"
          placeholder="write the body here"></textarea>
        <div class="sig" style="padding:0 12px 10px">}</div>
      </div>
      <div class="row">
        <button class="btn primary" id="go">Check</button>
        <button class="btn ghost" id="hintBtn">Hint</button>
        <button class="btn ghost" id="show">Show answer</button>
      </div>
      <div id="verdict"></div>`;
    if($("cn")){
      glossify($("cn").querySelector(".inner"));
      $("cn").ontoggle = () => { cOpen = $("cn").open; save(); };
    }
    if(done){ $("ta").value = l.answers[0]; pass(true); }
    $("go").onclick = () => {
      const keep = l.loose ? (l.sig.match(/[A-Za-z_][A-Za-z0-9_]*/g) || []) : null;
      if(check($("ta").value, l.answers, keep)){ solved[l.title]=true; save(); pass(false); }
      else {
        $("verdict").innerHTML = `<div class="verdict no">Not this one. Compare your expression against the
          registers line by line — something in the order, the operator or the width is different.</div>`;
        $("after").innerHTML = "";
      }
    };
    $("hintBtn").onclick = () => {
      $("verdict").innerHTML = `<div class="verdict hintbox">${l.hint}</div>`;
    };
    $("show").onclick = () => {
      $("ta").value = l.answers[0];
      $("verdict").innerHTML = `<div class="verdict hintbox">Answer filled in. Read it against the listing,
        then move on — this one won't count as solved.</div>`;
      $("after").innerHTML = `<div class="teach"><h3>Why it matters</h3>${l.teach}</div>`;
      glossify($("after"));
    };
  } else {
    $("work").innerHTML = "";
    $("after").innerHTML = "";
  }

  if(l.kind !== "ex") $("after").innerHTML = "";

  $("nav").innerHTML =
    (cur>0 ? `<button class="btn" id="prev">Back</button>` : "") +
    (cur<L.length-1 ? `<button class="btn primary" id="next">Next lesson</button>` : "");
  if($("prev")) $("prev").onclick = () => { cur--; save(); render(); scrollTo(0,0); };
  if($("next")) $("next").onclick = () => { cur++; save(); render(); scrollTo(0,0); };

  buildIndex(); save();
}

function pass(quiet){
  $("verdict").innerHTML = `<div class="verdict ok">${quiet?"Solved earlier.":"That matches."}</div>`;
  $("after").innerHTML = `<div class="teach"><h3>Why it matters</h3>${L[cur].teach}</div>`;
  glossify($("after"));
  $("rail").style.width = (100*Object.keys(solved).length/L.filter(x=>x.kind==="ex").length) + "%";
  buildIndex();
}

function buildIndex(){
  const total = L.filter(x=>x.kind==="ex").length;
  $("tally").textContent = `${Object.keys(solved).length} of ${total} functions matched`;
  let out = "", ch = -1;
  L.forEach((l,i) => {
    if(l.ch !== ch){ ch = l.ch; out += `<div class="ch">Chapter ${ch+1} · ${CH[ch]}</div>`; }
    const cls = solved[l.title] ? "done" : (seen[l.title] ? "seen" : "");
    out += `<div class="item ${i===cur?"cur":""}" data-i="${i}">
      <span class="dot ${l.kind==="ex"?cls:(seen[l.title]?"seen":"")}"></span>
      <span>${l.title}${l.kind==="concept"?' <span style="color:var(--dimmer);font-size:12px">reading</span>':''}</span>
    </div>`;
  });
  $("idx").innerHTML = out;
  [...document.querySelectorAll(".item")].forEach(el => {
    el.onclick = () => { cur = +el.dataset.i; closeIdx(); render(); scrollTo(0,0); };
  });
  $("resetWrap").innerHTML = `<button class="btn ghost" id="reset">Reset progress</button>`;
  $("reset").onclick = async () => {
    solved = {}; seen = {}; await save(); render();
  };
}

function openIdx(){ $("drawer").classList.add("on"); $("scrim").classList.add("on"); }
function closeIdx(){ $("drawer").classList.remove("on"); $("scrim").classList.remove("on"); }
$("openIdx").onclick = openIdx;
$("scrim").onclick = () => { closeIdx(); hideGloss(); };
$("gclose").onclick = hideGloss;
document.addEventListener("click", e => {
  if(!e.target.closest(".gloss") && !e.target.closest(".gpanel")) hideGloss();
});

load();
</script>
